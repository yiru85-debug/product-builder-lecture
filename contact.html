<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - LottoGen</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">LottoGen</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html#lotto-generator">번호 생성</a></li>
                    <li><a href="index.html#lotto-analysis">번호 분석</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="contact.html">문의하기</a></li>
                </ul>
            </nav>
            <button id="theme-toggle">테마 변경</button>
        </div>
    </header>

    <main>
        <section id="contact-form" class="container">
            <h2>제휴 및 기타 문의</h2>
            <p class="subtitle">궁금한 점이 있으시면 언제든지 문의주세요.</p>
            <form action="https://formspree.io/f/xkovbgrj" method="POST">
                <div class="form-group">
                    <label for="name">이름:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">이메일:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">메시지:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">문의하기</button>
            </form>
        </section>
    </main>
    
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2024 LottoGen. All rights reserved.</p>
            <nav class="footer-nav">
                <ul>
                    <li><a href="privacy.html">개인정보처리방침</a></li>
                    <li><a href="contact.html">문의하기</a></li>
                </ul>
            </nav>
        </div>
    </footer>

</body>
</html>
